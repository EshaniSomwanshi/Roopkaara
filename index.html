<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="bg-placeholder" aria-hidden="true"></div>

  <header class="menubar">
    <div class="menubar-left">
      <img class="menubar-logo" src="assets/images/logo%20-%20portfolio%20website.svg" alt="">
      <span class="menubar-brand">Eshani</span>
      <nav class="menubar-menu" aria-label="Menu bar">
        <span class="menubar-item">File</span>
        <span class="menubar-item">Edit</span>
        <span class="menubar-item">View</span>
        <span class="menubar-item">Window</span>
        <span class="menubar-item">Help</span>
      </nav>
    </div>
    <div class="menubar-right">
      <div class="menubar-datetime">
        <span id="menubar-date"></span>
        <span id="menubar-time"></span>
      </div>
    </div>
  </header>

  <nav class="dock-wrapper">
    <ul class="dock" aria-label="App dock">

      <li class="dock-item active">
        <span class="tooltip">Work</span>
        <button class="dock-icon icon-work" data-label="Work" aria-label="Work">
          <span class="icon-glyph icon-glyph--emoji">👩‍💻</span>
        </button>
        <span class="indicator"></span>
      </li>

      <li class="dock-item">
        <span class="tooltip">About</span>
        <button class="dock-icon icon-about" data-label="About" aria-label="About">
          <span class="icon-glyph icon-glyph--emoji">👩‍🎨</span>
        </button>
        <span class="indicator"></span>
      </li>

      <li class="dock-item">
        <span class="tooltip">Contact</span>
        <button class="dock-icon icon-contact" data-label="Contact" aria-label="Contact">
          <span class="icon-glyph icon-glyph--emoji">📬</span>
        </button>
        <span class="indicator"></span>
      </li>

      <li class="dock-item">
        <span class="tooltip">Resume</span>
        <button class="dock-icon icon-resume" data-label="Resume" aria-label="Resume">
          <span class="icon-glyph icon-glyph--emoji">📝</span>
        </button>
        <span class="indicator"></span>
      </li>

    </ul>
  </nav>

  <script src="script.js"></script>
</body>
</html>
